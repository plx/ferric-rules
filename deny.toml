[graph]
# An empty target filter is cargo-deny 0.20.2's supported all-target graph.
targets = []
all-features = true
exclude = []
exclude-dev = false
exclude-unpublished = false

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
disable-yank-checking = false
# Applicability and reconsideration conditions: docs/dependency-security-policy.md.
# These are advisory-specific exceptions, not package or severity suppressions.
ignore = [
    { id = "RUSTSEC-2025-0020", reason = "Ferric never calls PyString::from_object; revisit when changing Python conversion APIs or upgrading PyO3." },
    { id = "RUSTSEC-2026-0177", reason = "Ferric never creates PyCFunction closures; revisit when adding Python callbacks or upgrading PyO3." },
    { id = "RUSTSEC-2025-0141", reason = "Bincode 1.3.3 maintenance notice, no reported vulnerability; revisit with the versioned snapshot implementation." },
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained paste is an rmp build-time macro, no reported vulnerability; revisit the MessagePack dependency update." },
]

[licenses]
confidence-threshold = 0.8
include-dev = true
include-build = true
unused-license-exception = "deny"
private = { ignore = false, ignore-sources = [], registries = [] }
clarify = []
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "cbindgen@0.28.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
