[package]
name = "ferric-rules-cli"
description = "Command-line interface for the Ferric rules engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
ferric-rules-core = { workspace = true }
ferric-rules-parser = { workspace = true }
ferric-rules-runtime = { workspace = true }
rustyline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
slotmap = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-chrome = { workspace = true, optional = true }

[features]
tracing = ["trace-chrome"]
trace-chrome = ["dep:tracing", "dep:tracing-chrome", "dep:tracing-subscriber", "ferric-rules-runtime/tracing"]
serde = ["ferric-rules-runtime/serde"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
