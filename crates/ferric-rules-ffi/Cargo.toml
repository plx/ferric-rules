[package]
name = "ferric-rules-ffi"
description = "C-ABI foreign function interface for the Ferric rules engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
serde = ["ferric-rules-runtime/serde", "ferric-rules-pinned/serde"]
tracing = ["dep:tracing", "ferric-rules-runtime/tracing", "ferric-rules-pinned/tracing"]

[dependencies]
ferric-rules-core = { workspace = true }
ferric-rules-ffi-macros = { workspace = true }
ferric-rules-parser = { workspace = true }
ferric-rules-pinned = { workspace = true }
ferric-rules-runtime = { workspace = true }
slotmap = { workspace = true }
tracing = { workspace = true, optional = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
cbindgen = { workspace = true }
proptest = { workspace = true }

# FFI crate must allow unsafe code for C-ABI exports
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
