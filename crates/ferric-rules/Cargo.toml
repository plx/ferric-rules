[package]
name = "ferric-rules"
description = "A CLIPS-inspired rules engine — public facade crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude = ["tests/tracing_ci_contract.rs"]

[features]
serde = ["ferric-rules-runtime/serde"]
tracing = ["ferric-rules-runtime/tracing"]

[dependencies]
ferric-rules-core = { workspace = true }
ferric-rules-parser = { workspace = true }
ferric-rules-runtime = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

