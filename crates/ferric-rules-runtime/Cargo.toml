[package]
name = "ferric-rules-runtime"
description = "Engine, execution environment, value types, and symbol interning for Ferric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
serde = ["dep:serde", "dep:bincode", "dep:serde_json", "dep:ciborium", "dep:rmp-serde", "dep:postcard", "ferric-rules-core/serde", "ferric-rules-parser/serde"]
tracing = ["dep:tracing", "ferric-rules-core/tracing"]

[dependencies]
ferric-rules-core = { workspace = true }
ferric-rules-parser = { workspace = true }
thiserror = { workspace = true }
smallvec = { workspace = true }
slotmap = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
rmp-serde = { workspace = true }
postcard = { workspace = true }

[[bench]]
name = "name_registry_bench"
harness = false

[[bench]]
name = "rule_index_bench"
harness = false

[[bench]]
name = "template_registry_bench"
harness = false

[[bench]]
name = "serialization_bench"
harness = false
required-features = ["serde"]

[[bench]]
name = "fact_duplication_bench"
harness = false

[lints]
workspace = true
