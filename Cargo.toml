[workspace]
members = [
    "crates/ferric-rules",
    "crates/ferric-rules-bench-gen",
    "crates/ferric-rules-cli",
    "crates/ferric-rules-core",
    "crates/ferric-rules-ffi",
    "crates/ferric-rules-napi",
    "crates/ferric-rules-parser",
    "crates/ferric-rules-pinned",
    "crates/ferric-rules-runtime",
    "crates/ferric-rules-python",
    "examples/users-guide/*",
    "tools/users-guide-sync",
    "tools/bindings-conformance-adapter",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plx/ferric-rules"
readme = "README.md"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Line editing for interactive REPL. Ferric resolves its own history path, so
# rustyline's directory-discovery feature (and its fast-moving `home`
# dependency) is intentionally excluded from the MSRV surface.
rustyline = { version = "=14.0.0", default-features = false, features = ["custom-bindings", "with-file-history"] }

# C header generation (build-time only)
cbindgen = "=0.28.0"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
serde_json = "1"
sha2 = "0.10"
ciborium = "0.2"
rmp-serde = "=1.3.0"
postcard = { version = "1", features = ["alloc"] }

# Slot-based storage (serde feature always on — negligible cost, needed when serde is enabled)
slotmap = { version = "1", features = ["serde"] }

# Small inline vectors (serde feature always on — negligible cost, needed when serde is enabled)
smallvec = { version = "1", features = ["serde"] }

# Faster internal hash tables/sets
rustc-hash = "2"

# Bounded channels with cancel-aware and timeout-aware admission.
crossbeam-channel = "0.5"

# PyO3 Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3-build-config = "0.23"

# napi-rs Node.js bindings
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
napi-build = "=2.1.3"

# Property-based testing
proptest = "=1.6.0"

# Benchmarking
criterion = { version = "=0.5.1", features = ["html_reports"] }

# Temporary files used by tests and cbindgen. 3.15 is the newest line before
# tempfile moved to getrandom 0.3's newer target dependency graph.
tempfile = "=3.15.0"

# Tracing / profiling (optional, feature-gated)
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
tracing-chrome = "0.7"

# Apple Objective-C runtime (Apple targets only, used by ferric-rules-pinned for autorelease pools)
objc2 = { version = "0.6" }

# Internal crates. Exact synchronized versions are required because Cargo
# removes `path` when these packages are published to a registry.
ferric-rules = { version = "=0.1.0", path = "crates/ferric-rules" }
ferric-rules-core = { version = "=0.1.0", path = "crates/ferric-rules-core" }
ferric-rules-ffi = { version = "=0.1.0", path = "crates/ferric-rules-ffi" }
ferric-rules-cli = { version = "=0.1.0", path = "crates/ferric-rules-cli" }
ferric-rules-parser = { version = "=0.1.0", path = "crates/ferric-rules-parser" }
ferric-rules-pinned = { version = "=0.1.0", path = "crates/ferric-rules-pinned" }
ferric-rules-runtime = { version = "=0.1.0", path = "crates/ferric-rules-runtime" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common pedantic false-positives
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# FFI profile: development builds with panic=abort for C ABI safety
[profile.ffi-dev]
inherits = "dev"
panic = "abort"

# FFI profile: release builds with panic=abort for C ABI safety
[profile.ffi-release]
inherits = "release"
panic = "abort"
