name: Site checks

on:
  pull_request:
    paths:
      - "site/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "tests/clips_compat/corpus/**"
      - "tools/ferric-tools/**"
      - "docker/clips-reference/**"
      - ".github/workflows/site-check.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "tests/clips_compat/corpus/**"
      - "tools/ferric-tools/**"
      - "docker/clips-reference/**"
      - ".github/workflows/site-check.yml"

permissions:
  contents: read

jobs:
  site:
    name: Validate ferric-rules site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"
      - name: Build CLIPS reference
        working-directory: .
        run: docker build -t ferric-rules/clips-reference:latest docker/clips-reference/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Check formatting
        run: npm run format:check
      - name: Spellcheck content
        run: npm run spellcheck
      - name: Typecheck Astro content
        run: npm run check
      - name: Native type-check (TypeScript 7)
        run: npm run typecheck
      - name: Build site
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run validation tests
        run: npm run test
