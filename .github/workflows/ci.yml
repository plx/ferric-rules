name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/preflight.sh check

  msrv:
    name: MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
      - name: Check workspace with locked dependencies
        run: cargo check --workspace --locked
      - name: Check all workspace features
        run: cargo check --workspace --all-features --locked
      - name: Check serialization feature set
        run: cargo check -p ferric-rules-runtime --features serde --locked
      - name: Check CLI feature set
        run: cargo check -p ferric-rules-cli --locked
      - name: Test workspace and MSRV metadata
        run: cargo test --workspace --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: ./scripts/preflight.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: ./scripts/preflight.sh clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/preflight.sh test

  rust-package-artifact:
    name: Rust Package Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/verify-rust-packages.sh

  ffi-c-harness:
    name: FFI C Harness (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: just ffi-c-harness
        env:
          FERRIC_REQUIRE_SANITIZERS: "1"

  ffi-panic-harness:
    name: FFI Panic Containment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: just ffi-panic-harness

  ffi-diagnostics-tsan:
    name: FFI Diagnostics (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: just ffi-tsan-harness
        env:
          CC: clang
          FERRIC_TSAN_TOOLCHAIN: nightly-2025-11-04

  pinned-async-tsan:
    name: Pinned Async Completion (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - run: just pinned-async-tsan
        env:
          FERRIC_TSAN_TOOLCHAIN: nightly-2025-11-04

  ffi-go-asan:
    name: Go/C Lifecycle (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: just ffi-go-asan-harness
        env:
          FERRIC_ASAN_TOOLCHAIN: nightly-2025-11-04

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: just build-go-ffi
      - name: Verify committed FFI headers
        run: git diff --exit-code -- crates/ferric-rules-ffi/ferric.h bindings/go/internal/ffi/lib/ferric.h
      - uses: golangci/golangci-lint-action@v7
        with:
          # Keep in sync with golangci_lint_version in the justfile. v2.12.x is
          # the first line compatible with the Go 1.26 toolchain.
          version: v2.12.2
          working-directory: bindings/go

  go-test-stress:
    name: Go Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: just build-go-ffi
      - run: just test-go-stress 10

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build and test Python bindings
        working-directory: crates/ferric-rules-python
        run: |
          uv sync
          uv run pytest tests/ -v

  node-bindings:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli
      - name: Build native addon
        working-directory: crates/ferric-rules-napi
        run: |
          npm ci
          napi build --release
      - name: Build and lint TypeScript
        working-directory: packages/ferric
        run: |
          npm ci
          npm run build
          npm run lint
      - name: Run TypeScript binding tests
        working-directory: packages/ferric
        run: npm test

  bindings-conformance:
    name: Cross-binding Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli
      - run: just bindings-conformance

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install and check
        working-directory: tools/ferric-tools
        run: |
          uv sync
          uv run ruff format --check src/ tests/
          uv run ruff check src/ tests/
          uv run pytest -v

  ferric-semantic-regressions:
    name: Ferric Semantic Regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test -p ferric-rules --test ferric_semantic_regressions

  clips-semantic-differential:
    name: Pinned CLIPS Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare compatibility evidence
        run: mkdir -p /tmp/compat-evidence
      - name: Build Ferric candidate
        run: |
          cargo build --release -p ferric-rules-cli
          candidate_digest="$(sha256sum target/release/ferric | cut -d ' ' -f 1)"
          printf '{"schema":"ferric.compat-candidate-provenance","version":1,' \
            > /tmp/compat-evidence/candidate-provenance.json
          printf '"commit_sha":"%s","binary_sha256":"%s"}\n' \
            "${{ github.sha }}" "$candidate_digest" \
            >> /tmp/compat-evidence/candidate-provenance.json
      - name: Build pinned CLIPS reference image
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if docker build -t ferric-rules/clips-reference:latest docker/clips-reference/; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Docker build failed after ${attempt} attempts"
              exit 1
            fi

            retry_delay=$((attempt * 10))
            echo "::warning::Docker build attempt ${attempt} failed; retrying in ${retry_delay} seconds"
            sleep "$retry_delay"
          done
      - name: Record CLIPS reference provenance
        run: |
          scripts/clips-reference.sh provenance \
            > /tmp/compat-evidence/clips-reference-provenance.json
      - name: Scan claimed compatibility subset
        run: uv run --project tools/ferric-tools ferric-compat-scan
      - name: Generate compatibility harnesses
        run: |
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/ci-harnesses
      - name: Verify compatibility harnesses
        run: |
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/ci-harnesses --check
      - name: Run pinned differential assessment
        run: |
          uv run --project tools/ferric-tools ferric-compat-run \
            --all --require-selected --candidate-sha "${{ github.sha }}" \
            --workers 4 --timeout 30
      - name: Enforce exact compatibility policy
        run: |
          uv run --project tools/ferric-tools ferric-compat-ci-gate \
            --expected-commit-sha "${{ github.sha }}"
      - name: Generate compatibility report
        run: |
          uv run --project tools/ferric-tools ferric-compat-report \
            --tsv /tmp/compat-evidence/compat-report.tsv \
            --report /tmp/compat-evidence/compat-report.md \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Finalize compatibility evidence
        if: always()
        run: |
          mkdir -p /tmp/compat-evidence
          if [[ -f tests/examples/compat-manifest.json ]]; then
            cp tests/examples/compat-manifest.json \
              /tmp/compat-evidence/compat-manifest.json
            if [[ ! -f /tmp/compat-evidence/compat-report.md ]]; then
              uv run --project tools/ferric-tools ferric-compat-report \
                --tsv /tmp/compat-evidence/compat-report.tsv \
                --report /tmp/compat-evidence/compat-report.md \
                --repo "${{ github.repository }}" \
                --commit-sha "${{ github.sha }}" || true
            fi
          fi
          if [[ ! -f /tmp/compat-evidence/compat-report.md ]]; then
            printf '## CLIPS Compatibility Report\n\nAssessment did not produce a manifest.\n' \
              > /tmp/compat-evidence/compat-report.md
          fi
          if [[ -d .ferric-compat/failures ]]; then
            cp -R .ferric-compat/failures /tmp/compat-evidence/failures
          fi
          for gate_report in .ferric-compat/compat-ci-gate.json \
            .ferric-compat/compat-ci-gate.md; do
            if [[ -f "$gate_report" ]]; then
              cp "$gate_report" /tmp/compat-evidence/
            fi
          done
          printf '{"commit_sha":"%s","job_status":"%s"}\n' \
            "${{ github.sha }}" "${{ job.status }}" \
            > /tmp/compat-evidence/workflow-status.json
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-compatibility-gate-evidence
          retention-days: 30
          if-no-files-found: error
          path: /tmp/compat-evidence/

  users-guide-examples:
    name: Users Guide Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: just check-examples
      - run: just check-examples-sync

  license-notices:
    name: License Notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.0 --features cli --force
      - run: just license-notices-check

  bench-smoke:
    name: Bench Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo bench -p ferric-rules -- --test

  bench-thresholds:
    name: Bench Thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/bench-thresholds.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-threshold-report
          path: |
            target/bench-threshold-report.json
            target/bench-threshold-report.md
            target/criterion/**/new/estimates.json

  bench-compare:
    name: Comparative Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install CLIPS and hyperfine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clips
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
          sudo dpkg -i hyperfine_1.18.0_amd64.deb
      - name: Run comparative benchmarks
        run: ./scripts/bench-compare.sh --quick
      - uses: actions/upload-artifact@v4
        with:
          name: bench-compare-report
          path: |
            target/bench-compare/report.json
            target/bench-compare/report.md
