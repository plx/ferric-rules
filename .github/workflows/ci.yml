# Runs on pull requests to main and on pushes to main. Changes confined to the
# docs site (site/, documentation/) skip it; site-check.yml covers those.
# The pinned CLIPS compatibility gate is not here: it runs once per PR in
# pr-assessment.yml and once per push to main in compat-standalone.yml.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "documentation/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "documentation/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      # PyO3's build script and the ferric-rules-python unit-test binary need a
      # shared libpython.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo test -p ferric-rules-ffi --features serde --locked
      - name: Tracing feature
        run: |
          cargo clippy --workspace --all-targets --features tracing --locked -- -D warnings
          cargo test -p ferric-rules-runtime --features tracing --locked --test tracing_smoke
      - name: Users-guide examples
        run: |
          just check-examples
          just check-examples-sync

  msrv:
    name: MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # rust-toolchain.toml pins 1.93.0 and would otherwise override the
      # toolchain installed below.
      RUSTUP_TOOLCHAIN: "1.75.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked
      - run: cargo check --workspace --all-features --locked

  python-bindings:
    name: Python Bindings (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported CPython (requires-python >=3.9,<3.14).
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Build and test Python bindings from source
        working-directory: crates/ferric-rules-python
        run: |
          python_path="$(command -v python)"
          uv sync --locked --python "$python_path"
          uv run --locked --python "$python_path" maturin develop --quiet
          uv run --locked --python "$python_path" pytest tests/ -v
      - name: Exercise deterministic GIL and shutdown observations
        if: matrix.python-version == '3.13'
        working-directory: crates/ferric-rules-python
        run: |
          uv run --locked --python "$(command -v python)" \
            maturin develop --quiet --features testing
          .venv/bin/python -m pytest tests/test_gil_release.py \
            tests/test_threading.py tests/test_public_surface.py -v

  node-bindings:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build native addon with the locked napi-rs CLI
        working-directory: crates/ferric-rules-napi
        run: |
          npm ci
          npm run build
      - name: Build, lint, and test the TypeScript package
        working-directory: packages/ferric
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
      - name: Smoke the packed package in a clean consumer
        run: node scripts/test-node-package-artifact.mjs

  go:
    name: Go Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - run: just build-go-ffi
      - name: Verify committed FFI headers
        run: |
          just check-ffi-header
          git diff --exit-code -- crates/ferric-rules-ffi/ferric.h bindings/go/internal/ffi/lib/ferric.h
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with golangci_lint_version in the justfile.
          version: v2.12.2
          working-directory: bindings/go
      - name: Test with the race detector
        run: just test-go-race

  ffi-harnesses:
    name: FFI Harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: C ABI harness (ASan/UBSan)
        run: just ffi-c-harness
        env:
          FERRIC_REQUIRE_SANITIZERS: "1"
      - name: Panic containment (debug and release)
        run: just ffi-panic-harness
      - name: Mixed Rust/C diagnostics (ThreadSanitizer)
        run: just ffi-tsan-harness
        env:
          CC: clang
          FERRIC_TSAN_TOOLCHAIN: nightly-2025-11-04
      - name: Go/C lifecycle (AddressSanitizer)
        run: just ffi-go-asan-harness
        env:
          FERRIC_ASAN_TOOLCHAIN: nightly-2025-11-04

  pinned-async-tsan:
    name: Pinned Async Completion (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - run: just pinned-async-tsan
        env:
          FERRIC_TSAN_TOOLCHAIN: nightly-2025-11-04

  bindings-conformance:
    name: Cross-binding Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: just bindings-conformance

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Lint and test ferric-tools
        working-directory: tools/ferric-tools
        run: |
          uv sync --locked
          uv run ruff format --check src/ tests/
          uv run ruff check src/ tests/
          uv run pytest -v
