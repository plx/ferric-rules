name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/preflight.sh check

  msrv:
    name: MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
      - name: Check workspace with locked dependencies
        run: cargo check --workspace --locked
      - name: Check all workspace features
        run: cargo check --workspace --all-features --locked
      - name: Check serialization feature set
        run: cargo check -p ferric-rules-runtime --features serde --locked
      - name: Check CLI feature set
        run: cargo check -p ferric-rules-cli --locked
      - name: Test workspace and MSRV metadata
        run: cargo test --workspace --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: ./scripts/preflight.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: ./scripts/preflight.sh clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/preflight.sh test

  rust-package-artifact:
    name: Rust Package Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/verify-rust-packages.sh

  ffi-c-harness:
    name: FFI C Harness (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: just ffi-c-harness
        env:
          FERRIC_REQUIRE_SANITIZERS: "1"

  ffi-panic-harness:
    name: FFI Panic Containment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: just ffi-panic-harness

  ffi-diagnostics-tsan:
    name: FFI Diagnostics (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: just ffi-tsan-harness
        env:
          CC: clang
          FERRIC_TSAN_TOOLCHAIN: nightly-2025-11-04

  ffi-go-asan:
    name: Go/C Lifecycle (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-04
          components: rust-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: just ffi-go-asan-harness
        env:
          FERRIC_ASAN_TOOLCHAIN: nightly-2025-11-04

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: just build-go-ffi
      - name: Verify committed FFI headers
        run: git diff --exit-code -- crates/ferric-rules-ffi/ferric.h bindings/go/internal/ffi/lib/ferric.h
      - uses: golangci/golangci-lint-action@v7
        with:
          # Keep in sync with golangci_lint_version in the justfile. v2.12.x is
          # the first line compatible with the Go 1.26 toolchain.
          version: v2.12.2
          working-directory: bindings/go

  go-test-stress:
    name: Go Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: just build-go-ffi
      - run: just test-go-stress 10

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build and test Python bindings
        working-directory: crates/ferric-rules-python
        run: |
          uv sync
          uv run pytest tests/ -v

  node-bindings:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli
      - name: Build native addon
        working-directory: crates/ferric-rules-napi
        run: |
          npm install
          napi build --release
      - name: Build and lint TypeScript
        working-directory: packages/ferric
        run: |
          npm install
          npm run build
          npm run lint
      - name: Run TypeScript binding tests
        working-directory: packages/ferric
        run: npm test

  bindings-conformance:
    name: Cross-binding Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli
      - run: just bindings-conformance

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install and check
        working-directory: tools/ferric-tools
        run: |
          uv sync
          uv run ruff format --check src/ tests/
          uv run ruff check src/ tests/
          uv run pytest -v

  clips-compat:
    name: CLIPS Compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test -p ferric-rules --test clips_compat

  users-guide-examples:
    name: Users Guide Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: just check-examples
      - run: just check-examples-sync

  license-notices:
    name: License Notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.0 --features cli --force
      - run: just license-notices-check

  bench-smoke:
    name: Bench Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo bench -p ferric-rules -- --test

  bench-thresholds:
    name: Bench Thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: ./scripts/bench-thresholds.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-threshold-report
          path: |
            target/bench-threshold-report.json
            target/bench-threshold-report.md
            target/criterion/**/new/estimates.json

  bench-compare:
    name: Comparative Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install CLIPS and hyperfine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clips
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
          sudo dpkg -i hyperfine_1.18.0_amd64.deb
      - name: Run comparative benchmarks
        run: ./scripts/bench-compare.sh --quick
      - uses: actions/upload-artifact@v4
        with:
          name: bench-compare-report
          path: |
            target/bench-compare/report.json
            target/bench-compare/report.md
