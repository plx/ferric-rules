# Runs on every pull request to main, with no path filter: the branch ruleset
# requires the "PR Compatibility Gate" check produced here. This is the only
# per-PR run of the pinned CLIPS compatibility gate (inside compat-compare).
# Performance comparison is manual: dispatch perf-compare.yml.
name: PR Assessment

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-assessment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  compat-compare:
    name: Compat Compare
    uses: ./.github/workflows/compat-compare.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}

  compatibility-required:
    name: PR Compatibility Gate
    needs: compat-compare
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require blocking compatibility assessment
        env:
          COMPAT_RESULT: ${{ needs.compat-compare.result }}
        run: test "$COMPAT_RESULT" = success

  comment:
    name: Post PR Comment
    needs: compat-compare
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Download compat artifacts
        uses: actions/download-artifact@v7
        with:
          name: compat-diff-report
          path: /tmp/compat-artifacts
        continue-on-error: true

      - name: Compose and post comment
        run: |
          bash scripts/compose-pr-comment.sh \
            --pr "${{ github.event.number }}" \
            --compat-report "/tmp/compat-artifacts/compat-diff-report.md" \
            --compat-status "${{ needs.compat-compare.result }}"
        env:
          GH_TOKEN: ${{ github.token }}
