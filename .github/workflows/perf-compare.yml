# Manual only (workflow_dispatch): base-vs-head Criterion comparison with a
# CLIPS reference, or a bounded paired release audit (workload_set audit-*).
# Not run on pull requests.
name: Perf Compare

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA"
        required: true
        type: string
      workload_set:
        description: "Benchmark suite: standard, or a bounded audit-* suite"
        required: false
        default: "standard"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  perf-compare:
    if: ${{ !startsWith(inputs.workload_set, 'audit-') }}
    name: Perf Comparison Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install native CLIPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clips

      # ── Base branch benchmarks ─────────────────────────────────────────
      - name: Benchmark base branch
        run: |
          git checkout ${{ inputs.base_sha }}
          git checkout ${{ inputs.head_sha }} -- tools/ferric-tools/
          uv sync --project tools/ferric-tools
          rm -rf target/criterion
          uv run --project tools/ferric-tools ferric-perf-collect \
            --commit-sha "${{ inputs.base_sha }}" \
            --output /tmp/base-perf-manifest.json

      # ── Head benchmarks (with CLIPS reference) ─────────────────────────
      - name: Benchmark head
        run: |
          git checkout ${{ inputs.head_sha }}
          uv sync --project tools/ferric-tools
          rm -rf target/criterion
          uv run --project tools/ferric-tools ferric-perf-collect \
            --commit-sha "${{ inputs.head_sha }}" \
            --output /tmp/head-perf-manifest.json \
            --clips-reference

      # ── Comparison report ──────────────────────────────────────────────
      - name: Generate comparison report
        run: |
          uv run --project tools/ferric-tools ferric-perf-diff \
            /tmp/base-perf-manifest.json /tmp/head-perf-manifest.json \
            --report /tmp/perf-diff-report.md \
            --repo "${{ github.repository }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: perf-diff-report
          retention-days: 30
          path: |
            /tmp/perf-diff-report.md
            /tmp/base-perf-manifest.json
            /tmp/head-perf-manifest.json

  audit-compare:
    if: startsWith(inputs.workload_set, 'audit-')
    name: Paired release audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Measure identical workloads on both revisions
        env:
          AUDIT_BASE: ${{ inputs.base_sha }}
          AUDIT_HEAD: ${{ inputs.head_sha }}
          AUDIT_SUITE: ${{ inputs.workload_set }}
        run: python3 scripts/bench-audit.py "$AUDIT_BASE" "$AUDIT_HEAD" "$AUDIT_SUITE" "$RUNNER_TEMP/paired-audit"
      - name: Publish summary
        run: cat "$RUNNER_TEMP/paired-audit/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain estimates and build/measurement logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paired-release-audit
          retention-days: 30
          path: ${{ runner.temp }}/paired-audit
