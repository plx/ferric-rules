name: Compat Compare

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA"
        required: true
        type: string
  workflow_call:
    inputs:
      base_sha:
        description: "Base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  compat-compare:
    name: Compat Comparison Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Build CLIPS reference image
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if docker build -t ferric-rules/clips-reference:latest docker/clips-reference/; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Docker build failed after ${attempt} attempts"
              exit 1
            fi

            retry_delay=$((attempt * 10))
            echo "::warning::Docker build attempt ${attempt} failed; retrying in ${retry_delay} seconds"
            sleep "$retry_delay"
          done

      # ── Base branch assessment ─────────────────────────────────────────
      - name: Assess base branch
        run: |
          git checkout ${{ inputs.base_sha }}
          # Assess both revisions through the head observer protocol.
          git checkout ${{ inputs.head_sha }} -- \
            tools/ferric-tools/ \
            scripts/clips-reference.sh \
            crates/ferric-rules-cli/src/commands/compat_observe.rs \
            crates/ferric-rules-cli/src/main.rs \
            crates/ferric-rules-runtime/src/engine.rs
          cargo build --release -p ferric-rules-cli
          target/release/ferric compat-observe --help | grep -F -- '--scenario'
          uv run --project tools/ferric-tools ferric-compat-scan
          # Materialize head-format harnesses for base sources without modifying
          # the base branch's tracked harnesses.
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/base-harnesses
          uv run --project tools/ferric-tools ferric-compat-run --workers 4 --timeout 30
          cp tests/examples/compat-manifest.json /tmp/base-compat-manifest.json
          rm -f tests/examples/compat-manifest.json
          git checkout ${{ inputs.head_sha }}

      # ── Head assessment ────────────────────────────────────────────────
      - name: Build ferric
        run: cargo build --release -p ferric-rules-cli

      - name: Run compat scan
        run: uv run --project tools/ferric-tools ferric-compat-scan

      - name: Run compat assessment
        run: uv run --project tools/ferric-tools ferric-compat-run --workers 4 --timeout 30

      - name: Enforce head semantic differential policy
        run: uv run --project tools/ferric-tools ferric-compat-semantic-gate

      # ── Comparison report ──────────────────────────────────────────────
      - name: Generate comparison report
        continue-on-error: true
        run: |
          uv run --project tools/ferric-tools ferric-compat-diff \
            /tmp/base-compat-manifest.json tests/examples/compat-manifest.json \
            --tsv /tmp/compat-diff.tsv \
            --report /tmp/compat-diff-report.md \
            --repo "${{ github.repository }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Copy head manifest
        run: cp tests/examples/compat-manifest.json /tmp/head-compat-manifest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compat-diff-report
          retention-days: 30
          path: |
            /tmp/compat-diff.tsv
            /tmp/compat-diff-report.md
            /tmp/head-compat-manifest.json
            /tmp/base-compat-manifest.json
