name: Compat Compare

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA"
        required: true
        type: string
  workflow_call:
    inputs:
      base_sha:
        description: "Base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  compat-compare:
    name: Compat Comparison Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Prepare compatibility evidence
        run: mkdir -p /tmp/compat-evidence

      - name: Build head candidate for provenance
        run: |
          cargo build --release -p ferric-rules-cli
          candidate_digest="$(sha256sum target/release/ferric | cut -d ' ' -f 1)"
          printf '{"schema":"ferric.compat-candidate-provenance","version":1,' \
            > /tmp/compat-evidence/head-candidate-provenance.json
          printf '"commit_sha":"%s","binary_sha256":"%s"}\n' \
            "${{ inputs.head_sha }}" "$candidate_digest" \
            >> /tmp/compat-evidence/head-candidate-provenance.json

      - name: Build CLIPS reference image
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if docker build -t ferric-rules/clips-reference:latest docker/clips-reference/; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Docker build failed after ${attempt} attempts"
              exit 1
            fi

            retry_delay=$((attempt * 10))
            echo "::warning::Docker build attempt ${attempt} failed; retrying in ${retry_delay} seconds"
            sleep "$retry_delay"
          done

      - name: Record CLIPS reference provenance
        run: |
          scripts/clips-reference.sh provenance \
            > /tmp/compat-evidence/clips-reference-provenance.json

      # ── Base branch assessment ─────────────────────────────────────────
      - name: Assess base branch
        run: |
          git checkout ${{ inputs.base_sha }}
          # Retain the base scanner's own pre-run result before installing any
          # head tooling. The run comparison below intentionally uses the head
          # observer protocol, but scanner changes must compare each revision's
          # native scanner output.
          uv run --project tools/ferric-tools ferric-compat-scan
          cp tests/examples/compat-manifest.json /tmp/base-compat-scan-manifest.json
          # Use the head assessment tooling and reference wrapper while keeping
          # the Ferric candidate itself entirely at the requested base revision.
          # A wire-incompatible base must fail visibly rather than being turned
          # into a hybrid binary by overlaying head Rust runtime sources.
          git checkout ${{ inputs.head_sha }} -- \
            tools/ferric-tools/ \
            scripts/clips-reference.sh
          cargo build --release -p ferric-rules-cli
          target/release/ferric compat-observe --help | grep -F -- '--scenario'
          candidate_digest="$(sha256sum target/release/ferric | cut -d ' ' -f 1)"
          printf '{"schema":"ferric.compat-candidate-provenance","version":1,' \
            > /tmp/compat-evidence/base-candidate-provenance.json
          printf '"commit_sha":"%s","binary_sha256":"%s"}\n' \
            "${{ inputs.base_sha }}" "$candidate_digest" \
            >> /tmp/compat-evidence/base-candidate-provenance.json
          uv run --project tools/ferric-tools ferric-compat-scan
          # Materialize head-format harnesses for base sources without modifying
          # the base branch's tracked harnesses.
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/base-harnesses
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/base-harnesses --check
          uv run --project tools/ferric-tools ferric-compat-run \
            --all --require-selected --candidate-sha "${{ inputs.base_sha }}" \
            --workers 4 --timeout 30
          cp tests/examples/compat-manifest.json /tmp/base-compat-manifest.json
          rm -f tests/examples/compat-manifest.json
          git checkout ${{ inputs.head_sha }}
          touch /tmp/head-assessment-checkout

      # ── Head assessment ────────────────────────────────────────────────
      - name: Build ferric
        run: |
          cargo build --release -p ferric-rules-cli
          candidate_digest="$(sha256sum target/release/ferric | cut -d ' ' -f 1)"
          printf '{"schema":"ferric.compat-candidate-provenance","version":1,' \
            > /tmp/compat-evidence/head-candidate-provenance.json
          printf '"commit_sha":"%s","binary_sha256":"%s"}\n' \
            "${{ inputs.head_sha }}" "$candidate_digest" \
            >> /tmp/compat-evidence/head-candidate-provenance.json

      - name: Run compat scan
        run: |
          uv run --project tools/ferric-tools ferric-compat-scan
          cp tests/examples/compat-manifest.json /tmp/head-compat-scan-manifest.json

      - name: Generate retained scanner comparison
        run: |
          uv run --project tools/ferric-tools ferric-compat-diff \
            /tmp/base-compat-scan-manifest.json /tmp/head-compat-scan-manifest.json \
            --scanner-only \
            --tsv /tmp/compat-scanner-diff.tsv \
            --json /tmp/compat-scanner-diff.json \
            --report /tmp/compat-scanner-diff-report.md \
            --repo "${{ github.repository }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}"
          cat /tmp/compat-scanner-diff-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate head compatibility harnesses
        run: |
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/head-harnesses

      - name: Verify head compatibility harnesses
        run: |
          uv run --project tools/ferric-tools ferric-harness-gen \
            --output-dir .ferric-compat/head-harnesses --check

      - name: Run compat assessment
        run: |
          uv run --project tools/ferric-tools ferric-compat-run \
            --all --require-selected --candidate-sha "${{ inputs.head_sha }}" \
            --workers 4 --timeout 30

      - name: Enforce head compatibility policy
        run: |
          uv run --project tools/ferric-tools ferric-compat-ci-gate \
            --expected-commit-sha "${{ inputs.head_sha }}"

      # ── Comparison report ──────────────────────────────────────────────
      - name: Generate comparison report
        run: |
          uv run --project tools/ferric-tools ferric-compat-diff \
            /tmp/base-compat-manifest.json tests/examples/compat-manifest.json \
            --tsv /tmp/compat-diff.tsv \
            --report /tmp/compat-diff-report.md \
            --repo "${{ github.repository }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize compatibility evidence
        if: always()
        run: |
          mkdir -p /tmp/compat-evidence
          if [[ -f tests/examples/compat-manifest.json ]]; then
            if [[ -f /tmp/head-assessment-checkout ]]; then
              cp tests/examples/compat-manifest.json /tmp/head-compat-manifest.json
            else
              cp tests/examples/compat-manifest.json \
                /tmp/compat-evidence/base-intermediate-compat-manifest.json
            fi
          fi
          if [[ ! -f /tmp/compat-diff-report.md ]]; then
            printf '## CLIPS Compatibility Comparison\n\n' \
              > /tmp/compat-diff-report.md
            printf 'The blocking assessment did not reach the comparison-report phase.\n' \
              >> /tmp/compat-diff-report.md
          fi
          if [[ -f /tmp/compat-scanner-diff-report.md ]]; then
            if [[ -s /tmp/compat-diff-report.md ]]; then
              printf '\n' >> /tmp/compat-diff-report.md
            fi
            cat /tmp/compat-scanner-diff-report.md >> /tmp/compat-diff-report.md
          fi
          if [[ -d .ferric-compat/failures ]]; then
            cp -R .ferric-compat/failures /tmp/compat-evidence/failures
          fi
          for gate_report in .ferric-compat/compat-ci-gate.json \
            .ferric-compat/compat-ci-gate.md; do
            if [[ -f "$gate_report" ]]; then
              cp "$gate_report" /tmp/compat-evidence/
            fi
          done
          printf '{"base_sha":"%s","head_sha":"%s","job_status":"%s"}\n' \
            "${{ inputs.base_sha }}" "${{ inputs.head_sha }}" "${{ job.status }}" \
            > /tmp/compat-evidence/workflow-status.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-diff-report
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/compat-diff.tsv
            /tmp/compat-diff-report.md
            /tmp/compat-scanner-diff.tsv
            /tmp/compat-scanner-diff.json
            /tmp/compat-scanner-diff-report.md
            /tmp/head-compat-manifest.json
            /tmp/base-compat-manifest.json
            /tmp/head-compat-scan-manifest.json
            /tmp/base-compat-scan-manifest.json
            /tmp/compat-evidence/
