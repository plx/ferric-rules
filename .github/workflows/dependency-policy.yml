name: Dependency Policy

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Install Rust scanners
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.16
      - name: Scan dependencies and licenses
        run: ./scripts/dependency-check.sh
      - name: Check scanner rejection behavior
        if: '!cancelled()'
        run: ./scripts/test-dependency-scanners.sh
      - name: Retain scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scans-${{ github.sha }}
          path: dependency-policy-evidence/
          retention-days: 14
          if-no-files-found: error
