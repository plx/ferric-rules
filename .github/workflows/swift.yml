# Builds and tests the Swift package (macOS runner) on pull requests and pushes
# to main that touch the Swift binding or the Rust crates beneath it, and on
# manual dispatch.
name: Swift

on:
  push:
    branches: [main]
    paths:
      - "bindings/swift/**"
      - "crates/ferric-rules-core/**"
      - "crates/ferric-rules-ffi/**"
      - "crates/ferric-rules-ffi-macros/**"
      - "crates/ferric-rules-parser/**"
      - "crates/ferric-rules-pinned/**"
      - "crates/ferric-rules-runtime/**"
      - "scripts/build-swift.sh"
      - "scripts/swift-consumer-smoke.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/swift.yml"
  pull_request:
    branches: [main]
    paths:
      - "bindings/swift/**"
      - "crates/ferric-rules-core/**"
      - "crates/ferric-rules-ffi/**"
      - "crates/ferric-rules-ffi-macros/**"
      - "crates/ferric-rules-parser/**"
      - "crates/ferric-rules-pinned/**"
      - "crates/ferric-rules-runtime/**"
      - "scripts/build-swift.sh"
      - "scripts/swift-consumer-smoke.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  swift:
    name: Swift Package
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
      - name: Show toolchains and SDKs
        run: |
          rustc --version
          swift --version
          xcodebuild -showsdks
      - name: Build macOS and iOS native libraries
        run: scripts/build-swift.sh
      - name: Test Swift 6 concurrency and lifetime contracts
        run: swift test --package-path bindings/swift -Xswiftc -strict-concurrency=complete
      - name: Build iOS device wrapper
        run: |
          swift build --package-path bindings/swift --triple arm64-apple-ios18.0 \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Xswiftc -strict-concurrency=complete
      - name: Build iOS simulator wrapper
        run: |
          swift build --package-path bindings/swift --triple arm64-apple-ios18.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xswiftc -strict-concurrency=complete
      - name: Run external macOS consumer
        run: scripts/swift-consumer-smoke.sh
